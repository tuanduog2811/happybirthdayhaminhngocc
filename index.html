<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Love Letter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#3A222C; --bg-2:#1F1218;
    --card:#FFFFFF; --card-edge:#F0DDE4;
    --pink:#F6C3D4; --pink-2:#F2AFC6; --pink-line:#C9607F;
    --red:#E0343E; --rose:#F19BB3;
    --ink:#5A4048; --ink-soft:#9B818B;
    --script:"Dancing Script","Segoe Script",cursive;
    --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg-1:#2E1A22; --bg-2:#150C10; }
  }
  :root[data-theme="dark"]{ --bg-1:#2E1A22; --bg-2:#150C10; }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;min-height:100dvh;
    background:radial-gradient(110% 75% at 50% 18%, var(--bg-1), var(--bg-2) 72%);
    background-color:var(--bg-2);
    font-family:var(--sans);font-weight:300;color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    padding:26px 16px 30px;overflow-x:hidden;
  }
  .sprites{position:absolute;width:0;height:0;overflow:hidden;}

  .sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
  .sky svg{position:absolute;bottom:-70px;opacity:0;will-change:transform,opacity;}

  .shell{position:relative;z-index:1;width:100%;max-width:600px;display:flex;flex-direction:column;align-items:center;gap:20px;}

  .card{
    position:relative;width:100%;max-width:340px;
    background:var(--card);border-radius:10px;
    box-shadow:0 30px 60px rgba(0,0,0,.5), 0 0 0 1px var(--card-edge);
    padding:34px 26px;display:grid;overflow:hidden;
    transition:max-width .7s cubic-bezier(.2,.8,.25,1), height .7s cubic-bezier(.2,.8,.25,1), padding .7s ease;
  }
  .card.opened{max-width:560px;padding:38px clamp(24px,6vw,52px) 34px;}
  .panel{grid-area:1/1;transition:opacity .45s ease, transform .5s ease;}
  .panel.hide{opacity:0;transform:scale(.96);pointer-events:none;}

  .deco{position:absolute;inset:0;pointer-events:none;transition:opacity .5s ease;}
  .deco svg{position:absolute;animation:bob 4.5s ease-in-out infinite;}
  .card.opened .deco{opacity:.28;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg));}50%{transform:translateY(-7px) rotate(var(--r,0deg));}}

  /* phong bì */
  .env-wrap{display:flex;flex-direction:column;align-items:center;gap:22px;padding:18px 0 4px;}
  .envelope{position:relative;width:min(206px,58vw);height:calc(min(206px,58vw)*.68);perspective:900px;cursor:pointer;border-radius:5px;}
  .envelope:focus-visible{outline:2px solid var(--pink-line);outline-offset:12px;border-radius:6px;}
  .env-back{position:absolute;inset:0;background:var(--pink);border:1.5px solid var(--pink-line);border-radius:5px;}
  .env-paper{position:absolute;left:7%;width:86%;height:82%;bottom:9%;z-index:2;background:#FFF;border:1px solid var(--card-edge);border-radius:3px;
    transition:transform .9s cubic-bezier(.2,.75,.25,1);}
  .env-front{position:absolute;inset:0;z-index:3;overflow:hidden;border-radius:5px;}
  .env-front svg{position:absolute;inset:0;width:100%;height:100%;}
  .env-flap{position:absolute;top:-1px;left:0;width:100%;height:52%;z-index:4;transform-origin:50% 0;
    transition:transform .85s cubic-bezier(.6,.05,.25,1);}
  .env-flap svg{width:100%;height:100%;display:block;}
  .heart-seal{position:absolute;left:50%;top:50%;width:26px;height:24px;z-index:5;transform:translate(-50%,-50%);color:var(--red);
    transition:transform .5s ease, opacity .45s ease;}
  .envelope:hover .heart-seal{transform:translate(-50%,-50%) scale(1.12);}
  .open .env-flap{transform:rotateX(-176deg);z-index:1;}
  .open .heart-seal{transform:translate(-50%,-50%) scale(1.9);opacity:0;}
  .open .env-paper{transform:translateY(-118%);}

  .hint{margin:0;text-align:center;color:var(--ink-soft);font-size:.82rem;}
  .hint b{display:block;font-family:var(--script);font-size:1.5rem;font-weight:700;color:var(--pink-line);margin-bottom:2px;}

  /* lá thư */
  .meta{display:flex;justify-content:space-between;font-size:.7rem;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:14px;}
  .greet{font-family:var(--script);font-weight:700;font-size:clamp(2rem,7vw,2.7rem);line-height:1.1;margin:0 0 16px;color:var(--pink-line);}
  .body{max-width:60ch;}
  .body p{margin:0 0 16px;font-size:.98rem;line-height:1.95;color:var(--ink);}
  .caret{display:inline-block;width:2px;height:1em;background:var(--red);vertical-align:-1px;animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:22px;}
  .photo{
    margin:0;flex:0 0 auto;width:clamp(132px,38%,190px);
    background:#FFF;padding:7px 7px 24px;border-radius:2px;
    box-shadow:0 8px 20px rgba(90,60,70,.26);
    transform:rotate(-4deg);transform-origin:bottom left;
    opacity:0;transition:opacity .7s ease .3s;
  }
  .photo.show{opacity:1;}
  .photo img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:1px;background:var(--pink);}
  .photo figcaption{font-family:var(--script);font-size:1.05rem;color:var(--ink-soft);text-align:center;margin-top:5px;line-height:1;}
  .sign{text-align:right;flex:1 1 auto;opacity:0;transition:opacity .8s ease;padding-bottom:6px;}
  .sign.show{opacity:1;}
  .sign span{display:block;font-size:.76rem;color:var(--ink-soft);margin-bottom:2px;}
  .sign strong{font-family:var(--script);font-size:1.9rem;font-weight:700;color:var(--pink-line);}

  .tools{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;}
  .tool{font:400 .82rem var(--sans);background:transparent;color:rgba(255,235,242,.72);
    border:1px solid rgba(255,235,242,.28);border-radius:999px;padding:8px 16px;cursor:pointer;
    transition:background .2s,color .2s,border-color .2s;}
  .tool:hover{background:rgba(255,235,242,.12);color:#FFF;border-color:rgba(255,235,242,.5);}
  .tool:focus-visible{outline:2px solid var(--pink-2);outline-offset:3px;}
  .note{font-size:.74rem;color:rgba(255,235,242,.42);text-align:center;margin:0;max-width:46ch;line-height:1.5;}

  @media (max-width:420px){
    .foot{gap:10px;}
    .sign strong{font-size:1.6rem;}
  }
  @media (prefers-reduced-motion: reduce){ *{transition-duration:.01ms !important;animation:none !important;} }
</style>
</head>
<body>

<svg class="sprites" aria-hidden="true">
  <symbol id="s-heart" viewBox="0 0 32 29">
    <path d="M16 28.6S1.8 20.1 1.8 10.6C1.8 5.2 5.9 1.8 10 1.8c2.7 0 4.9 1.5 6 3.5 1.1-2 3.3-3.5 6-3.5 4.1 0 8.2 3.4 8.2 8.8 0 9.5-14.2 18-14.2 18z"/>
  </symbol>
  <symbol id="s-cake" viewBox="0 0 48 52">
    <path d="M24 2c1.9 2.6 3 4.2 3 5.6 0 1.7-1.3 3-3 3s-3-1.3-3-3C21 6.2 22.1 4.6 24 2z" fill="#F6B93B"/>
    <rect x="22" y="10" width="4" height="9" rx="1.6" fill="#FFF3C4"/>
    <rect x="22" y="12.6" width="4" height="2.6" fill="#F19BB3"/>
    <path d="M9 20h30a4 4 0 0 1 4 4v3H5v-3a4 4 0 0 1 4-4z" fill="#F2AFC6"/>
    <circle cx="11" cy="27" r="3.2" fill="#F2AFC6"/><circle cx="20" cy="27" r="3.2" fill="#F2AFC6"/>
    <circle cx="29" cy="27" r="3.2" fill="#F2AFC6"/><circle cx="38" cy="27" r="3.2" fill="#F2AFC6"/>
    <rect x="5" y="27" width="38" height="15" rx="2.5" fill="#FBE6D2"/>
    <rect x="5" y="33" width="38" height="3" fill="#F6D3BC"/>
    <rect x="1.5" y="42" width="45" height="4.5" rx="2.2" fill="#E9D2C0"/>
  </symbol>
</svg>

<div class="sky" id="sky" aria-hidden="true"></div>

<div class="shell">
  <div class="card" id="card">
    <div class="deco" id="deco" aria-hidden="true"></div>

    <section class="panel" id="panelEnv">
      <div class="env-wrap">
        <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Mở lá thư">
          <div class="env-back"></div>
          <div class="env-paper"></div>
          <div class="env-front">
            <svg viewBox="0 0 100 68" preserveAspectRatio="none">
              <path d="M0 68 L50 34 L100 68 Z" fill="#F6C3D4"/>
              <path d="M0 0 L50 34 L0 68" fill="#F2AFC6"/>
              <path d="M100 0 L50 34 L100 68" fill="#F2AFC6"/>
              <path d="M0 0 L50 34 L100 0 M0 68 L50 34 L100 68" fill="none" stroke="#C9607F" stroke-width="1.1" vector-effect="non-scaling-stroke"/>
            </svg>
          </div>
          <div class="env-flap">
            <svg viewBox="0 0 100 35" preserveAspectRatio="none">
              <path d="M0.6 0.6 H99.4 L50 34.4 Z" fill="#F6C3D4" stroke="#C9607F" stroke-width="1.1" vector-effect="non-scaling-stroke"/>
            </svg>
          </div>
          <svg class="heart-seal" viewBox="0 0 32 29" fill="currentColor"><use href="#s-heart"/></svg>
        </div>
        <p class="hint"><b id="hintName"></b>Chạm vào trái tim để mở thư</p>
      </div>
    </section>

    <section class="panel hide" id="panelLetter" aria-live="polite">
      <div class="meta"><span id="metaPlace"></span><span id="metaDate"></span></div>
      <h1 class="greet" id="greet"></h1>
      <div class="body" id="body"></div>
      <div class="foot">
        <figure class="photo" id="photo" hidden>
          <img id="photoImg" alt="">
          <figcaption id="photoCap"></figcaption>
        </figure>
        <div class="sign" id="sign"><span id="signLabel"></span><strong id="signName"></strong></div>
      </div>
    </section>
  </div>

  <div class="tools">
    <button class="tool" id="btnMute" type="button" hidden>♫ Tắt nhạc</button>
    <button class="tool" id="btnClose" type="button" hidden>Gấp thư lại</button>
  </div>
  <p class="note" id="note"></p>
</div>

<script src="letter.js"></script>
<script>
const L = window.LETTER || {};
const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- đổ nội dung ---------- */
$("hintName").textContent  = L.hint || "";
$("greet").textContent     = L.greeting || "";
$("metaPlace").textContent = L.place || "";
$("metaDate").textContent  = L.date || "";
$("signLabel").textContent = L.signLabel || "";
$("signName").textContent  = L.signature || "";
const PARAS = Array.isArray(L.paragraphs) ? L.paragraphs : [];

if (L.photo){
  $("photoImg").src = L.photo;
  $("photoCap").textContent = L.photoCaption || "";
  $("photo").hidden = false;
  $("photoImg").addEventListener("error", () => { $("photo").hidden = true; });
  $("photoImg").addEventListener("load", resizeCard);
}

/* ---------- trang trí trên thiệp ---------- */
const DECO = [
  {t:"heart",x:14,y:6, s:30,c:"#F19BB3",r:-12},
  {t:"heart",x:38,y:2, s:38,c:"#E0343E",r:6},
  {t:"heart",x:62,y:7, s:26,c:"#F19BB3",r:14},
  {t:"heart",x:80,y:14,s:22,c:"#E0343E",r:-8},
  {t:"cake", x:5, y:34,s:26,r:-6},
  {t:"cake", x:86,y:40,s:24,r:7},
  {t:"heart",x:16,y:74,s:34,c:"#F19BB3",r:9},
  {t:"heart",x:42,y:80,s:28,c:"#E0343E",r:-10},
  {t:"heart",x:68,y:76,s:32,c:"#F19BB3",r:12},
  {t:"cake", x:48,y:92,s:22,r:0}
];
const NS = "http://www.w3.org/2000/svg";
DECO.forEach((d,i) => {
  const svg = document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox", d.t === "heart" ? "0 0 32 29" : "0 0 48 52");
  svg.style.cssText = `left:${d.x}%;top:${d.y}%;width:${d.s}px;--r:${d.r}deg;transform:rotate(${d.r}deg);animation-delay:${i*.35}s;`;
  if (d.t === "heart") svg.setAttribute("fill", d.c);
  const use = document.createElementNS(NS,"use");
  use.setAttribute("href", d.t === "heart" ? "#s-heart" : "#s-cake");
  svg.appendChild(use); $("deco").appendChild(svg);
});

/* ---------- tim & bánh trôi ở nền ---------- */
function float(burst){
  const cake = Math.random() < .28;
  const svg = document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox", cake ? "0 0 48 52" : "0 0 32 29");
  svg.style.width = (cake ? 26 + Math.random()*22 : 12 + Math.random()*20) + "px";
  svg.style.left = Math.random()*100 + "vw";
  if (!cake) svg.setAttribute("fill", Math.random() < .45 ? "#E0343E" : "#F19BB3");
  const use = document.createElementNS(NS,"use");
  use.setAttribute("href", cake ? "#s-cake" : "#s-heart");
  svg.appendChild(use); $("sky").appendChild(svg);
  const drift = (Math.random()-.5)*200, spin = (Math.random()-.5)*90;
  svg.animate(
    [{transform:"translate(0,0) rotate(0deg)",opacity:0},
     {opacity:.16+Math.random()*.3,offset:.18},
     {transform:`translate(${drift}px,-${innerHeight+160}px) rotate(${spin}deg)`,opacity:0}],
    {duration: burst ? 2800+Math.random()*1400 : 10000+Math.random()*8000, easing:"cubic-bezier(.4,0,.6,1)"}
  ).onfinish = () => svg.remove();
}
if (!reduce){
  for (let i=0;i<8;i++) setTimeout(()=>float(false), i*1000);
  setInterval(()=>float(false), 1700);
}

/* ---------- nhạc ---------- */
let audio = null;
let mutedByUser = false;
let pausedByHidden = false;

function startMusic(){
  if (!L.music || audio) return;
  audio = new Audio(L.music);
  audio.loop = true;
  audio.volume = typeof L.volume === "number" ? L.volume : .75;
  audio.play().then(() => {
    $("btnMute").hidden = false;
  }).catch(() => {
    $("btnMute").hidden = false;
    $("btnMute").textContent = "♫ Bật nhạc";
    $("note").textContent = "Trình duyệt đang chặn tự phát nhạc, bấm nút để bật.";
  });
}
$("btnMute").addEventListener("click", () => {
  if (!audio) return startMusic();
  if (audio.paused){ audio.play(); mutedByUser = false; }
  else { audio.pause(); mutedByUser = true; }
  $("btnMute").textContent = audio.paused ? "♫ Bật nhạc" : "♫ Tắt nhạc";
});

/* Một số trình duyệt trong app (Zalo, Messenger, Facebook...) tải ngầm
   trang ở chế độ ẩn trước khi hiện ra, khiến 2 bản nhạc chạy chồng lên
   nhau nghe như bị lặp. Tạm dừng khi trang đang ẩn, phát lại khi hiện. */
document.addEventListener("visibilitychange", () => {
  if (!audio) return;
  if (document.hidden){
    if (!audio.paused){ audio.pause(); pausedByHidden = true; }
  } else if (pausedByHidden && !mutedByUser){
    audio.play().catch(() => {});
    pausedByHidden = false;
  }
});

/* ---------- đánh máy ---------- */
let skipped = false;
$("panelLetter").addEventListener("click", () => skipped = true);

function typeLetter(){
  const box = $("body");
  box.innerHTML = PARAS.map(t => `<p>${t}</p>`).join("");
  box.style.minHeight = box.offsetHeight + "px";
  box.innerHTML = "";
  let pi = 0;
  const speed = reduce ? 0 : 20;
  (function nextPara(){
    if (pi >= PARAS.length){
      $("sign").classList.add("show");
      $("photo").classList.add("show");
      return;
    }
    const p = document.createElement("p");
    const caret = document.createElement("span");
    caret.className = "caret"; p.appendChild(caret); box.appendChild(p);
    const chars = Array.from(PARAS[pi]);
    let ci = 0;
    (function tick(){
      if (skipped){
        caret.remove();
        p.appendChild(document.createTextNode(chars.slice(ci).join("")));
        pi++; nextPara(); return;
      }
      if (ci < chars.length){
        const ch = chars[ci++];
        p.insertBefore(document.createTextNode(ch), caret);
        setTimeout(tick, ch === "," ? speed*6 : ch === "." ? speed*11 : speed);
      } else { caret.remove(); pi++; setTimeout(nextPara, 380); }
    })();
  })();
}

/* ---------- mở / gấp ---------- */
const card = $("card");
let opened = false;
function resizeCard(){
  if (opened) card.style.height = $("panelLetter").offsetHeight + 72 + "px";
}
function openLetter(){
  if (opened) return;
  opened = true;
  startMusic();
  $("envelope").classList.add("open");
  if (!reduce) for (let i=0;i<20;i++) setTimeout(()=>float(true), i*80);
  card.style.height = card.offsetHeight + "px";
  setTimeout(() => {
    $("panelEnv").classList.add("hide");
    $("panelLetter").classList.remove("hide");
    card.classList.add("opened");
    requestAnimationFrame(() => { typeLetter(); requestAnimationFrame(resizeCard); });
    $("btnClose").hidden = false;
  }, reduce ? 0 : 1150);
}
$("envelope").addEventListener("click", openLetter);
$("envelope").addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openLetter(); }
});

$("btnClose").addEventListener("click", () => {
  $("panelLetter").classList.add("hide");
  $("sign").classList.remove("show");
  $("photo").classList.remove("show");
  card.classList.remove("opened");
  setTimeout(() => {
    $("panelEnv").classList.remove("hide");
    $("envelope").classList.remove("open");
    $("body").innerHTML = ""; $("body").style.minHeight = "";
    card.style.height = $("panelEnv").offsetHeight + 72 + "px";
    setTimeout(() => card.style.height = "", 700);
    skipped = false; opened = false;
    $("btnClose").hidden = true;
    if (audio){ audio.pause(); audio = null; $("btnMute").hidden = true; $("btnMute").textContent = "♫ Tắt nhạc"; }
    mutedByUser = false; pausedByHidden = false;
  }, 420);
});
addEventListener("resize", resizeCard);
</script>
</body>
</html>
